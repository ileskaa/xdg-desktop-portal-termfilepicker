[package]
name = "xdg-desktop-portal-termfilepicker"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.191"
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "signal", "time", "sync", "fs"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
